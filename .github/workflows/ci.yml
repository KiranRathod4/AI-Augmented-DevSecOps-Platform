# .github/workflows/ci.yml

name: CI Pipeline

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop] # run on every push to these branches
  pull_request:
    branches: [main] # run on every PR targeting main

# ── Global env (available in all jobs) ────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  # github.repository is "username/repo-name" — lowercased for image tags
  IMAGE_PREFIX: ghcr.io/kiranrathod4

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: LINT
  # Fastest job — runs ruff linter. Fails immediately if any style violation.
  # Costs ~20 seconds. You want this to run first so you don't waste time
  # building Docker images before catching a silly import error.
  # ════════════════════════════════════════════════════════════════════════════
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # caches pip downloads between runs

      - name: Install ruff
        run: pip install ruff==0.4.9

      - name: Run ruff linter
        run: ruff check services/
        # If this fails, the error tells you exactly which line and what rule.
        # Fix with: ruff check services/ --fix

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: TEST
  # Runs pytest with coverage. Depends on lint passing (needs: lint).
  # Uses a matrix strategy to run api-gateway and user-service tests in parallel.
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: "Test (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: lint # only run tests if linting passes

    strategy:
      matrix:
        service: [api-gateway, user-service]
      fail-fast: false # don't cancel the other matrix job if one fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Run tests with coverage
        run: |
          pytest services/${{ matrix.service }}/tests/ \
            -v \
            --tb=short \
            --cov=services/${{ matrix.service }} \
            --cov-report=xml:coverage-${{ matrix.service }}.xml \
            --cov-report=term-missing \
            --cov-fail-under=70
        # --cov-fail-under=70: pipeline fails if coverage drops below 70%
        # This enforces a minimum test coverage standard

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() # upload even if tests fail — useful for debugging
        with:
          name: coverage-${{ matrix.service }}
          path: coverage-${{ matrix.service }}.xml
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: BUILD + SECURITY SCAN
  # Builds Docker images and scans with Trivy for CVEs.
  # Runs both services in parallel via matrix.
  # IMPORTANT: if Trivy finds HIGH or CRITICAL vulnerabilities, the build FAILS.
  # This is the DevSecOps gate — security is not optional.
  # ════════════════════════════════════════════════════════════════════════════
  build-scan:
    name: "Build + Scan (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: test # only build if tests pass

    strategy:
      matrix:
        service: [api-gateway, user-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx enables BuildKit — faster builds, better caching, multi-platform support

      - name: Build Docker image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          target: runtime
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          # load: true puts the image into the local Docker daemon so Trivy can scan it
          load: true
          push: false
          cache-from: type=gha # use GitHub Actions cache for layer cache
          cache-to: type=gha,mode=max # persist cache after build

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}"
          format: "table"
          exit-code: "1" # exit code 1 = fail the pipeline
          ignore-unfixed: true # only fail on vulnerabilities that HAVE a fix available
          vuln-type: "os,library"
          severity: "CRITICAL"
        # Why: this stops you from shipping images with known critical security holes.
        # A CVE in your base image or a dependency that has a patched version = blocked.

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results-${{ matrix.service }}
          path: trivy-results-${{ matrix.service }}.sarif
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4: PUSH TO REGISTRY
  # Only runs on pushes to main (not on PRs).
  # Authenticates to ghcr.io and pushes the images with two tags:
  #   - :sha-<commit>   (immutable, traceable)
  #   - :latest         (floating, always points to newest)
  # ════════════════════════════════════════════════════════════════════════════
  push:
    name: "Push (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: build-scan
    # Only push on merges to main — not on every PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write # needed to push to ghcr.io

    strategy:
      matrix:
        service: [api-gateway, user-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is auto-provided by Actions — no secret needed

      - name: Extract metadata for image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-                    # sha-abc1234
            type=raw,value=latest                   # latest
            type=ref,event=branch                   # branch name

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          target: runtime
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 5: DEPLOY
  # Installs kubectl + Minikube in the runner, starts Minikube,
  # substitutes the image tag in manifests, and applies them.
  # Verifies rollout completes and pods become Ready.
  #
  # Note: in a real production setup, this job deploys to a real EKS cluster
  # using AWS credentials stored in GitHub Secrets. The Minikube approach here
  # is a local-first proxy that's safe for learning without cloud costs.
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Deploy to Minikube"
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@master
        with:
          minikube-version: "1.33.0"
          kubernetes-version: "v1.30.0"
          driver: docker
          cpus: 2
          memory: 2048

      - name: Verify cluster is running
        run: |
          kubectl get nodes
          kubectl cluster-info

      - name: Create namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Substitute image tags in manifests
        run: |
          # Replace YOUR_GITHUB_USERNAME placeholder with actual owner
          # and :latest with the specific commit SHA for traceability
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA="${{ github.sha }}"
          sed -i "s|YOUR_GITHUB_USERNAME|${OWNER}|g" k8s/api-gateway.yaml k8s/user-service.yaml
          sed -i "s|:latest|:sha-${SHA:0:7}|g" k8s/api-gateway.yaml k8s/user-service.yaml
          echo "Deploying images with SHA tag: sha-${SHA:0:7}"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/user-service.yaml
          kubectl apply -f k8s/api-gateway.yaml

      - name: Wait for deployments to be ready #added detailed debugging info if rollout fails
        run: |
          echo "Waiting for user-service..."
          kubectl rollout status deployment/user-service -n devops-platform --timeout=300s || {
          echo "Rollout failed. Debugging info:"
          kubectl describe deployment user-service -n devops-platform
          kubectl get pods -n devops-platform -o wide
          kubectl logs -n devops-platform -l app=user-service --tail=50
          exit 1
          }
    
          echo "Waiting for api-gateway..."
          kubectl rollout status deployment/api-gateway -n devops-platform --timeout=300s

      - name: Wait for deployments to be ready
        run: |
          echo "Waiting for user-service..."
          kubectl rollout status deployment/user-service -n devops-platform --timeout=300s

          echo "Waiting for api-gateway..."
          kubectl rollout status deployment/api-gateway -n devops-platform --timeout=300s

      - name: Verify pods are running
        run: |
          kubectl get pods -n devops-platform
          kubectl get services -n devops-platform

      - name: Smoke test the deployed services
        run: |
          # Port-forward gateway to localhost for the smoke test
          kubectl port-forward -n devops-platform svc/api-gateway 8000:8000 &
          PF_PID=$!
          sleep 5

          echo "Testing /health endpoint..."
          curl --fail --retry 3 http://localhost:8000/health
          echo ""

          echo "Testing /metrics endpoint..."
          curl --fail http://localhost:8000/metrics | head -5
          echo ""

          kill $PF_PID
          echo "Smoke tests passed!"

      - name: Print deployment summary
        if: always()
        run: |
          echo "=== Deployment Summary ==="
          kubectl describe deployment api-gateway -n devops-platform | grep -E "Image:|Replicas:|Conditions:"
          kubectl describe deployment user-service -n devops-platform | grep -E "Image:|Replicas:|Conditions:"
