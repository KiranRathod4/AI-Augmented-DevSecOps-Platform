# pyproject.toml

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import order)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modernise Python syntax)
]
ignore = [
    "E501",  # line too long — ruff handles this via line-length above
    "B008",  # do not perform function calls in argument defaults (FastAPI does this legitimately)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports OK in test files (fixtures etc.)

[tool.pytest.ini_options]
testpaths    = ["services/api-gateway/tests", "services/user-service/tests"]
asyncio_mode = "auto"
addopts      = "-v --tb=short --cov=. --cov-report=term-missing"