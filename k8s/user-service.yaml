apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: devops-platform
  labels:
    app: user-service
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          # Image tag is replaced by CI using sed before kubectl apply
          image: ghcr.io/YOUR_GITHUB_USERNAME/user-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              value: "sqlite:///./test.db"   # simplified for Minikube; real DB in Phase 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: devops-platform
spec:
  selector:
    app: user-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP